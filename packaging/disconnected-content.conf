# Static, validated publications only. Private state and staging are outside this alias.
Alias "/disconnected-content/" "/var/www/disconnected-content/public/"
<Directory "/var/www/disconnected-content/public">
    Options -Indexes -FollowSymLinks -ExecCGI -Includes
    AllowOverride None
    SetHandler default-handler
    ForceType application/octet-stream
    Require method GET HEAD
</Directory>
<Location "/disconnected-content/">
    SetHandler default-handler
</Location>
